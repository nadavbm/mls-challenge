replicaCount: 3

image:
  repository: registry.internal.example/placeholder
  tag: ""
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""
  # Google service account to impersonate through Workload Identity.
  gcpServiceAccount: ""

service:
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 512Mi

probes:
  liveness: /healthz
  readiness: /ready

podDisruptionBudget:
  enabled: true
  minAvailable: 2
