apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: checkout-service
  namespace: checkout
spec:
  interval: 5m
  releaseName: checkout-service
  chart:
    spec:
      chart: ./charts/service
      sourceRef:
        kind: GitRepository
        name: platform
        namespace: flux-system
  values:
    image:
      repository: registry.internal.example/checkout-service
      tag: "1.4.2"
    replicaCount: 1
