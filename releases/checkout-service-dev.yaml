apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: checkout-service
  namespace: checkout-dev
spec:
  interval: 5m
  releaseName: checkout-service
  chart:
    spec:
      chart: ./charts/service
      sourceRef:
        kind: GitRepository
        name: platform
        namespace: flux-system
  values:
    image:
      repository: registry.internal.example/checkout-service
      tag: "1.5.0-rc3"
    serviceAccount:
      gcpServiceAccount: checkout-service@ml-platform-prod.iam.gserviceaccount.com
